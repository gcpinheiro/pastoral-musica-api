events {
  worker_connections 1024;
}

http {
  log_format resilience '$time_iso8601 status=$status upstream=$upstream_addr '
                        'upstream_status=$upstream_status request_time=$request_time '
                        'upstream_time=$upstream_response_time "$request"';

  access_log /var/log/nginx/access.log resilience;
  error_log /var/log/nginx/error.log notice;

  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream pastoral_api {
    zone pastoral_api 64k;
    server api:3000 resolve;
    keepalive 32;
  }

  server {
    listen 80;

    location = /lb-health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location / {
      proxy_pass http://pastoral_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Upstream-Addr $upstream_addr always;
      proxy_connect_timeout 2s;
      proxy_send_timeout 15s;
      proxy_read_timeout 15s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
